name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        # Windows 运行器默认用 PowerShell 执行 run 步骤，
        # 这会触发 npm 在 Windows 上一个已知的 "Exit handler never called!" 假死/误报 bug，
        # 导致 npm ci 表面上"成功"但 node_modules/.bin 没有完整生成，后续 tsc 命令找不到。
        # 改用 Git Bash（Windows 运行器自带）执行可以规避这个问题。
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 升级 npm
        # Node 20.x 自带的 npm 10.8.2 在 Windows 运行器上有一个已知 bug（npm/cli#7657）：
        # npm ci 会假死并抛出 "Exit handler never called!"，
        # 导致 node_modules/.bin 没有完整生成。
        # 这里固定升级到一个已修复该问题、且仍兼容 Node 20 的版本（npm@latest 在此时已升级到
        # 要求 Node 22+ 的 npm 12，会与 Node 20 不兼容，因此显式指定版本号而不是用 latest）。
        run: npm install -g npm@10.9.2

      - name: 安装依赖
        # 这里刻意用 npm install 而不是 npm ci：
        # npm ci 在这个 Windows 运行器环境下即使升级了 npm 版本仍然会稳定触发
        # "Exit handler never called!" 假死 bug（npm/cli#7657 及一系列类似 issue），
        # 而 npm install 走的是不同的内部实现路径，不受影响。
        # 项目有提交 package-lock.json，npm install 同样会按锁定的版本精确安装。
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 构建 Windows 安装包（NSIS + 便携版）
        run: npm run build:win

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 桌面悬浮日历-windows
          path: |
            release/*.exe
          if-no-files-found: error
