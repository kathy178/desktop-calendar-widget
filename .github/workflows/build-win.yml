name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        # 说明：这里用 yarn（Windows 运行器自带 1.22.22，无需额外安装）而不是 npm。
        # 排查记录：在当前 windows-latest 运行器镜像上，无论是 npm ci 还是 npm install，
        # 无论是否升级 npm 版本、是否关闭 setup-node 的缓存、用 bash 还是 pwsh 执行，
        # 都稳定复现 npm 自身的 "Exit handler never called!" 假死 bug（社区已知问题，
        # 例如 npm/cli#7657 等一系列类似 issue），导致依赖安装失败。
        # yarn 是完全独立的实现，不受此 npm 特有 bug 影响，这里仅在 CI 环境使用；
        # 本地开发和打包仍然按 README 用 npm 即可，不受影响。
        run: yarn install --network-timeout 300000

      - name: 类型检查
        run: yarn typecheck

      - name: 单元测试
        run: yarn test

      - name: 构建 Windows 安装包（NSIS + 便携版）
        run: yarn build:win

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 桌面悬浮日历-windows
          path: |
            release/*.exe
          if-no-files-found: error
