name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        # Windows 运行器默认用 PowerShell 执行 run 步骤，
        # 这会触发 npm 在 Windows 上一个已知的 "Exit handler never called!" 假死/误报 bug，
        # 导致 npm ci 表面上"成功"但 node_modules/.bin 没有完整生成，后续 tsc 命令找不到。
        # 改用 Git Bash（Windows 运行器自带）执行可以规避这个问题。
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 构建 Windows 安装包（NSIS + 便携版）
        run: npm run build:win

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 桌面悬浮日历-windows
          path: |
            release/*.exe
          if-no-files-found: error
